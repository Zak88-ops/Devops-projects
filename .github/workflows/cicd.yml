name: Voting App Multi-Service CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: vote
            context: ./docker-voting-app/vote
          - name: result
            context: ./docker-voting-app/result
          - name: worker
            context: ./docker-voting-app/worker
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Convert Repository Name to Lowercase
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.service.name }}:${{ github.sha }} \
            -t ghcr.io/${{ env.REPO_LOWER }}/${{ matrix.service.name }}:latest \
            ${{ matrix.service.context }}

      - name: DevSecOps Vulnerability Scan (Trivy)
        uses:
